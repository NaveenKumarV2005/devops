name: Ci pipeline

on:
  push:
      branches:
          - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: setup node
              uses: actions/setup-node@v3

            - name: Install dependencies
              run: npm install

            - name: Run Test
              run: npm test

            - name: Last step
              run: npm test
